name: Daten-Update

on:
  schedule:
    # 3x taeglich um 8:17, 14:17 und 20:17 Uhr deutscher Zeit.
    # GitHub rechnet in UTC. Deshalb stehen hier die Zeiten fuer Sommer- UND Winterzeit;
    # der Schritt "Uhrzeit pruefen" (scripts/gate.py) laesst nur die jeweils passenden Laeufe durch.
    # Der stuendliche Eintrag arbeitet an BVB-Spieltagen (7 Std. vor bis 4 Std. nach dem Anpfiff) und kurz nach
    # jedem Bundesliga-, Champions-League- und DFB-Pokal-Spiel (dann nur Spiele, Prognosen, Statistiken, Spieltag-Zentrale).
    - cron: '17 6 * * *'
    - cron: '17 7 * * *'
    - cron: '17 12 * * *'
    - cron: '17 13 * * *'
    - cron: '17 18 * * *'
    - cron: '17 19 * * *'
    - cron: '47 * * * *'
    - cron: '17 * * * *'  # zweiter Spiel-Check: nach jedem Spiel spaetestens nach ~30 Minuten neu gerechnet
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daten-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - name: Uhrzeit pruefen
        id: gate
        run: python3 scripts/gate.py "${{ github.event_name }}" "${{ github.event.schedule }}" >> "$GITHUB_OUTPUT"

      - name: Daten holen, Prognosen rechnen und mit Gemini auswerten
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Ersatz-KIs (alle kostenlos) - springen der Reihe nach ein, wenn Gemini nicht antwortet
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python3 scripts/update.py ${{ steps.gate.outputs.modules }}

      - name: Daten speichern
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "bvb09-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Keine Aenderungen"
          else
            git commit -m "Daten-Update $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
            git pull --rebase -X theirs origin main
            git push
          fi

      - uses: actions/configure-pages@v6
        if: steps.gate.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.run == 'true'
        with:
          path: docs

  deploy:
    needs: update
    if: needs.update.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
