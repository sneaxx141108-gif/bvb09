<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BVB 09">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Inoffizielle BVB-Fan-App: Transfers, Marktwerte, Spiele, Kader und Statistiken – automatisch 3× täglich aktualisiert.">
<title>BVB 09</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&amp;family=Inter+Tight:wght@400;500;600;700;800;900&amp;display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg class="sp-logo" viewBox="0 0 40 40">
    <circle class="sp-disc" cx="20" cy="20" r="17"></circle>
    <circle class="sp-ring" cx="20" cy="20" r="19"></circle>
    <g class="sp-txt">
      <circle cx="20" cy="20" r="14.5" fill="none" stroke="#0A0900" stroke-width="1.6"></circle>
      <text x="20" y="21.5" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="900" font-size="12" fill="#0A0900">BVB</text>
      <text x="20" y="30" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="900" font-size="7.5" fill="#0A0900">09</text>
    </g>
  </svg>
  <div class="sp-word"><span>B</span><span>V</span><span>B</span><span>&nbsp;</span><span>0</span><span>9</span></div>
  <div class="sp-wipe"></div>
</div>
<div class="ambient" aria-hidden="true"></div>
<div class="safe-top" aria-hidden="true"></div>
<header id="topbar" aria-hidden="true">
  <button type="button" class="tb-back" data-action="back" hidden aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="tb-title">BVB 09</span>
</header>
<div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#0A0900" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></div>
<main id="view" tabindex="-1"></main>
<nav id="tabbar" aria-label="Hauptnavigation">
  <span class="tab-ind" aria-hidden="true"></span>
  <a class="tab" data-tab="home" href="#/home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg><span>Home</span></a>
  <a class="tab" data-tab="transfers" href="#/transfers/news"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h15l-4-4M20 16H5l4 4"/></svg><span>Transfers</span></a>
  <a class="tab" data-tab="spiele" href="#/spiele"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5l3.4 2.5-1.3 4h-4.2l-1.3-4zM12 3.5v4M20.1 9.4l-4.7.6M17.3 19.2 14.1 14M6.7 19.2 9.9 14M3.9 9.4l4.7.6"/></svg><span>Spiele</span></a>
  <a class="tab" data-tab="kader" href="#/kader"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5 4 6l1.5 4.5L8 9.6V20.5h8V9.6l2.5.9L20 6l-4-2.5a4 4 0 0 1-8 0z"/></svg><span>Kader</span></a>
  <a class="tab" data-tab="mehr" href="#/mehr"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg><span>Mehr</span></a>
</nav>
<div id="story" hidden role="dialog" aria-modal="true" aria-label="Transfer-Story"></div>
<div id="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <section class="sheet-panel" role="dialog" aria-modal="true" aria-label="Details">
    <div class="sheet-grip" data-close></div>
    <div class="sheet-body"></div>
  </section>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;color:#fff">Bitte JavaScript aktivieren, damit die App funktioniert.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
